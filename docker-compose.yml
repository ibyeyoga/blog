services:
    nginx:
        container_name: nginx
        image: nginx:latest
        ports:
            - 80:80
        volumes:
            - ./docker/nginx/:/etc/nginx/conf.d/:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - /mnt/host/d/gits:/var/www/html:ro

    php83:
        container_name: php83
        build: ./docker/php/8.3
        cap_add:
            - SYS_PTRACE
        expose:
            - 9000
        volumes:
            - /mnt/host/d/gits:/var/www/html:rw
            - ./docker/php/8.3/www.conf:/usr/local/etc/php-fpm.d/www.conf

