{{- $isHost := eq .Values.codeSource "host" -}}
{{/* host 模式用 dev 镜像（只有 vendor）；image 模式用 prod 镜像（vendor+代码） */}}
{{- $phpTag := ternary .Values.image.php.tagDev .Values.image.php.tagProd $isHost -}}
{{- $phpImage := printf "%s:%s" .Values.image.php.repository $phpTag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blog.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blog.labels" . | nindent 8 }}
      annotations:
        # 把 ConfigMap 的内容摘要写进 pod template。
        # 为什么必须这么做：ConfigMap 用 subPath 挂载时是【快照】，永远不会
        # 热更新；而 ConfigMap 内容又不属于 pod template，光改它 Helm 算不出
        # 差异、不会滚动。加上这个注解后，配置一改就会触发 Pod 重建。
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: config
          configMap:
            name: {{ include "blog.fullname" . }}-config
        {{- if $isHost }}
        # host 模式：宿主项目根目录。下面用 subPath 逐个挂需要的子路径，
        # 这样 vendor 依然来自镜像（不会去读宿主那几万个小文件）。
        - name: host-code
          hostPath:
            path: {{ .Values.hostCode.projectPath }}
            type: Directory
        {{- else }}
        # image 模式：代码在镜像里，nginx 容器拿不到，靠 emptyDir 共享
        - name: code
          emptyDir: {}
        {{- end }}
      {{- if not $isHost }}
      initContainers:
        # 把项目镜像里的代码（含 vendor）拷进 emptyDir，供 nginx 容器共用。
        # 这是节点本地磁盘之间的拷贝，不经过 Windows↔WSL 桥接，很快。
        - name: code-init
          image: "{{ $phpImage }}"
          imagePullPolicy: {{ .Values.image.php.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - cp -a /var/www/html/. /app/
          volumeMounts:
            - name: code
              mountPath: /app
      {{- end }}
      containers:
        # ========================= nginx =========================
        - name: nginx
          image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          volumeMounts:
            {{- if $isHost }}
            # nginx 只用到 public/ —— root、try_files、SCRIPT_FILENAME 都落在里面
            - name: host-code
              mountPath: /var/www/html/public
              subPath: public
            {{- else }}
            - name: code
              mountPath: /var/www/html
            {{- end }}
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        # ========================= php-fpm =========================
        - name: php-fpm
          image: "{{ $phpImage }}"
          imagePullPolicy: {{ .Values.image.php.pullPolicy }}
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.php | nindent 12 }}
          volumeMounts:
            {{- if $isHost }}
            # 逐个把宿主上的目录/文件覆盖到镜像内容之上。
            # 没列在 mounts 里的（最重要的就是 vendor）保持镜像里的那份。
            {{- range .Values.hostCode.mounts }}
            - name: host-code
              mountPath: /var/www/html/{{ . }}
              subPath: {{ . }}
            {{- end }}
            {{- else }}
            - name: code
              mountPath: /var/www/html
            {{- end }}
            - name: config
              mountPath: /usr/local/etc/php/conf.d/custom.ini
              subPath: php.ini
            - name: config
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
