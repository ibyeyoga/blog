{{- $fullname := printf "%s-blog" .Release.Name -}}
# ==================== ConfigMap ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
data:
  default.conf: |
    {{- .Values.nginx.conf | nindent 4 }}
  php.ini: |
    {{- .Values.php.ini | nindent 4 }}
  www.conf: |
    {{- .Values.php.www | nindent 4 }}
---
# ==================== PVC ====================
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
# ==================== Service ====================
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
  selector:
    app: {{ $fullname }}
---
# ==================== Deployment ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}
  template:
    metadata:
      labels:
        app: {{ $fullname }}
    spec:
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-pvc
        {{- end }}
        - name: app-code
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ $fullname }}-config
        - name: php-config
          configMap:
            name: {{ $fullname }}-config
      initContainers:
        - name: init-code
          image: "{{ .Values.image.php.repository }}:{{ .Values.image.php.tag }}"
          imagePullPolicy: {{ .Values.image.php.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - cp -a /var/www/html/. /app/
          volumeMounts:
            - name: app-code
              mountPath: /app
      containers:
        # ====== Nginx ======
        - name: nginx
          image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

        # ====== PHP-FPM ======
        - name: php-fpm
          image: "{{ .Values.image.php.repository }}:{{ .Values.image.php.tag }}"
          imagePullPolicy: {{ .Values.image.php.pullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: APP_NAME
              value: {{ .Values.env.APP_NAME | quote }}
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: APP_KEY
              value: {{ .Values.env.APP_KEY | quote }}
            - name: APP_DEBUG
              value: {{ .Values.env.APP_DEBUG | quote }}
            - name: APP_URL
              value: {{ .Values.env.APP_URL | quote }}
            - name: DB_CONNECTION
              value: {{ .Values.env.DB_CONNECTION | quote }}
            - name: DB_HOST
              value: {{ .Values.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.env.DB_PORT | quote }}
            - name: DB_DATABASE
              value: {{ .Values.env.DB_DATABASE | quote }}
            - name: DB_USERNAME
              value: {{ .Values.env.DB_USERNAME | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.env.DB_PASSWORD | quote }}
            - name: SESSION_DRIVER
              value: {{ .Values.env.SESSION_DRIVER | quote }}
            - name: CACHE_STORE
              value: {{ .Values.env.CACHE_STORE | quote }}
            - name: QUEUE_CONNECTION
              value: {{ .Values.env.QUEUE_CONNECTION | quote }}
          resources:
            {{- toYaml .Values.resources.php | nindent 12 }}
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            - name: php-config
              mountPath: /usr/local/etc/php/php.ini
              subPath: php.ini
            - name: php-config
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    php artisan migrate --force || true
                    php artisan config:cache || true
                    php artisan route:cache || true
                    php artisan view:cache || true
