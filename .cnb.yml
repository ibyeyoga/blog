master:
  push:
    - services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      stages:
        - name: 构建运行镜像
          script: docker build -t ${IMAGE_TAG} -f helm/docker/Dockerfile .
            
        - name: 上传镜像到制品库
          script: docker push ${IMAGE_TAG}